# Render.com — set in dashboard if not using this blueprint:
# Build Command:  npm install --include=dev && npm run render:build
# Start Command:  npm run render:start
# Do NOT set PORT — Render injects it.

services:
  - type: web
    name: lottery-backend
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run render:build
    startCommand: npm run render:start
    healthCheckPath: /health
    envVars:
      - key: NODE_OPTIONS
        value: --max-old-space-size=460
